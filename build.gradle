buildscript {
    repositories {
        maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
    }
}

plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    id 'org.spongepowered.mixin' version '0.7.+'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

mixin {
    add sourceSets.main, "gpuloader.refmap.json"
    config "mixins.gpuloader.json"
}

// Mojang ships Java 17 to end users in 1.18+, so your mod should target Java 17.
java.toolchain.languageVersion = JavaLanguageVersion.of(17)

println "Java: ${System.getProperty 'java.version'}, JVM: ${System.getProperty 'java.vm.version'} (${System.getProperty 'java.vendor'}), Arch: ${System.getProperty 'os.arch'}"
minecraft {
    mappings channel: mapping_channel, version: mapping_version
    copyIdeResources = true
    runs {
    
        configureEach {
            workingDirectory project.file('run')
        
            property 'forge.logging.markers', 'REGISTRIES'
        
            property 'forge.logging.console.level', 'debug'
            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }
        client {
        
            property 'forge.enabledGameTestNamespaces', mod_id
            arg "-mixin.config=mixins.gpuloader.json"
        }
        server {
            property 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'
        }
    
    
    
        gameTestServer {
            property 'forge.enabledGameTestNamespaces', mod_id
        }
        data {
        
            workingDirectory project.file('run-data')
        
            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
        }
    }
}
// Include resources generated by data generators.
sourceSets.main.resources { srcDir 'src/generated/resources' }
repositories {
    mavenCentral()
}
// We CANNOT use JarJar for LWJGL because it causes a JPMS split package crash on the client.
// The client already provides LWJGL, and Forge will crash if it's bundled.
// Separate configuration to resolve native JARs for extraction
configurations {
    lwjglNatives
    serverLibs
}
dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
    
    implementation project(':gpu-load-API')
    def lwjgl_version = "3.3.1"
    implementation "org.lwjgl:lwjgl:${lwjgl_version}"
    serverLibs "org.lwjgl:lwjgl:${lwjgl_version}"
    
    implementation "org.lwjgl:lwjgl-glfw:${lwjgl_version}"
    serverLibs "org.lwjgl:lwjgl-glfw:${lwjgl_version}"
    
    implementation "org.lwjgl:lwjgl-opengl:${lwjgl_version}"
    serverLibs "org.lwjgl:lwjgl-opengl:${lwjgl_version}"
    
    runtimeOnly "org.lwjgl:lwjgl:${lwjgl_version}:natives-windows"
    runtimeOnly "org.lwjgl:lwjgl-glfw:${lwjgl_version}:natives-windows"
    runtimeOnly "org.lwjgl:lwjgl-opengl:${lwjgl_version}:natives-windows"
    runtimeOnly "org.lwjgl:lwjgl:${lwjgl_version}:natives-linux"
    runtimeOnly "org.lwjgl:lwjgl-glfw:${lwjgl_version}:natives-linux"
    runtimeOnly "org.lwjgl:lwjgl-opengl:${lwjgl_version}:natives-linux"
    lwjglNatives "org.lwjgl:lwjgl:${lwjgl_version}:natives-windows"
    lwjglNatives "org.lwjgl:lwjgl-glfw:${lwjgl_version}:natives-windows"
    lwjglNatives "org.lwjgl:lwjgl-opengl:${lwjgl_version}:natives-windows"
    lwjglNatives "org.lwjgl:lwjgl:${lwjgl_version}:natives-linux"
    lwjglNatives "org.lwjgl:lwjgl-glfw:${lwjgl_version}:natives-linux"
    lwjglNatives "org.lwjgl:lwjgl-opengl:${lwjgl_version}:natives-linux"
}
// Extract native .dll/.so from LWJGL native JARs into build resources
// These get embedded in the mod JAR and extracted at runtime on servers
tasks.register('extractLwjglNatives') {
    def outputDir = file("${buildDir}/resources/main/natives")
    outputs.dir(outputDir)
    
    doLast {
        outputDir.mkdirs()
        configurations.lwjglNatives.files.each { nativeJar ->
            copy {
                from zipTree(nativeJar)
                include '**/*.dll', '**/*.so', '**/*.dylib'
                eachFile { fcp ->
                
                    fcp.relativePath = new RelativePath(true, fcp.name + ".bundled")
                }
                into outputDir
                includeEmptyDirs = false
            }
        }
        logger.lifecycle("[GPU Loader] Extracted native libraries to ${outputDir}")
    }
}
// Extract server library jars as .disabled to avoid client module conflicts
tasks.register('extractServerLibs') {
    def outputDir = file("${buildDir}/resources/main/server-libs")
    outputs.dir(outputDir)
    
    doLast {
        outputDir.mkdirs()
        configurations.serverLibs.files.each { libJar ->
            copy {
                from libJar
                into outputDir
                rename { String fileName -> fileName + ".disabled" }
            }
        }
        logger.lifecycle("[GPU Loader] Packaged server libraries to ${outputDir}")
    }
}
tasks.named('processResources').configure {
    dependsOn 'extractLwjglNatives'
    dependsOn 'extractServerLibs'
}
// This block of code expands all declared replace properties in the specified resource targets.
// A missing property will result in an error. Properties are expanded using ${} Groovy notation.
// When "copyIdeResources" is enabled, this will also run before the game launches in IDE environments.
// See https://docs.gradle.org/current/dsl/org.gradle.language.jvm.tasks.ProcessResources.html
tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version: minecraft_version, minecraft_version_range: minecraft_version_range,
            forge_version: forge_version, forge_version_range: forge_version_range,
            loader_version_range: loader_version_range,
            mod_id: mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
            mod_authors: mod_authors, mod_description: mod_description,
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}
// Example for how to get properties into the manifest for reading at runtime.
tasks.named('jar', Jar).configure {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
                'MixinConfigs': 'mixins.gpuloader.json'
        ])
    }
    finalizedBy 'reobfJar'
}
// However if you are in a multi-project build, dev time needs unobfed jar files, so you can delay the obfuscation until publishing by doing:
// tasks.named('publish').configure {
//     dependsOn 'reobfJar'
// }
// Example configuration to allow publishing using the maven-publish plugin
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifact jar
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/mcmodsrepo"
        }
    }
}
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
    options.compilerArgs << "-AoutRefMapFile=${projectDir}/build/resources/main/gpuloader.refmap.json"
}
